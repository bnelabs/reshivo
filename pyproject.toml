[project]
name = "rematter"
version = "0.1.0"
description = "Evidence-backed recycled-material selection and computational product design"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rematter = "rematter.cli:main"

[tool.setuptools]
packages = ["rematter"]
